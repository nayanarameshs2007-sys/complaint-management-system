version: '3.8'

services:
  complaint-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complaint-system-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
